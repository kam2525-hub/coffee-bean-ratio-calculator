<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハンドドリップ珈琲・粉量と抽出比率の逆算シミュレーター</title>
    <style>
        :root {
            --primary: #4a3319;
            --primary-light: #6f4e37;
            --accent: #c19a6b;
            --bg-color: #f7f4ef;
            --card-bg: #ffffff;
            --text-main: #2c221e;
            --text-sub: #7a6b63;
            --border-color: #e3dcd3;
            --shadow: 0 10px 25px rgba(74, 51, 25, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            fill: var(--primary);
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            padding: 10px 4px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .mode-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 8px;
        }

        .input-with-unit {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px 16px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--accent);
        }

        .unit {
            position: absolute;
            right: 16px;
            color: var(--text-sub);
            font-weight: 600;
            pointer-events: none;
        }

        .range-slider {
            margin-top: 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-light);
            cursor: pointer;
        }

        .presets {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .preset-chip {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-chip:hover, .preset-chip.active {
            background: var(--primary-light);
            color: white;
            border-color: var(--primary-light);
        }

        /* 結果表示カード */
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .result-box {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .result-box.highlight {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            grid-column: span 2;
            border: none;
        }

        .result-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .result-box.highlight .result-label {
            color: var(--accent);
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .result-box.highlight .result-value {
            color: white;
            font-size: 2.4rem;
        }

        .result-unit {
            font-size: 0.9rem;
            font-weight: normal;
        }

        /* 抽出ステップ */
        .steps-container {
            border-top: 1px dashed var(--border-color);
            padding-top: 16px;
        }

        .steps-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-light);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .step-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .step-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .step-time {
            font-weight: 600;
            color: var(--primary);
        }

        .step-desc {
            color: var(--text-sub);
        }

        .step-amount {
            font-weight: 700;
            color: var(--text-main);
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: auto;
        }

        @media(max-width: 480px) {
            body { padding: 12px 8px; }
            .card { padding: 16px; }
            .result-value { font-size: 1.5rem; }
            .result-box.highlight .result-value { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M18.5,10h-2V7c0-0.55-0.45-1-1-1h-9c-0.55,0-1,0.45-1,1v3h-2C2.45,10,2,10.45,2,11v1c0,2.97,2.16,5.43,5,5.91V20H6c-0.55,0-1,0.45-1,1s0.45,1,1,1h12c0.55,0,1-0.45,1-1s-0.45-1-1-1h-1v-2.09c2.84-0.48,5-2.94,5-5.91v-1C20,10.45,19.55,10,18.5,10z M4,12h2v3.08C4.85,14.69,4,13.43,4,12z M15,18H9v-2h6V18z M18,12h-2v3.08c1.15-0.39,2-1.65,2-2.93V12z"/>
            </svg>
            <h1>珈琲ドリップ逆算シミュレーター</h1>
            <p class="subtitle">粉量・杯数・マグ容量から最適な抽出レシピを一発算出</p>
        </header>

        <!-- メイン入力カード -->
        <div class="card">
            <!-- モード切り替え -->
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="cups">杯数指定</button>
                <button class="mode-btn" data-mode="beans">粉量指定</button>
                <button class="mode-btn" data-mode="mug">マグ容量</button>
            </div>

            <!-- 入力フィールド: 杯数 -->
            <div class="input-group" id="group-cups">
                <label>淹れたい杯数</label>
                <div class="input-with-unit">
                    <input type="number" id="input-cups" value="1" min="0.5" max="10" step="0.5">
                    <span class="unit">杯</span>
                </div>
                <div class="presets" style="margin-top: 8px;">
                    <button class="preset-chip" data-val="1">1杯</button>
                    <button class="preset-chip" data-val="2">2杯</button>
                    <button class="preset-chip" data-val="3">3杯</button>
                    <button class="preset-chip" data-val="4">4杯</button>
                </div>
            </div>

            <!-- 入力フィールド: 粉量 (初期非表示) -->
            <div class="input-group" id="group-beans" style="display: none;">
                <label>使いたいコーヒー豆のグラム数</label>
                <div class="input-with-unit">
                    <input type="number" id="input-beans" value="15" min="1" max="100" step="1">
                    <span class="unit">g</span>
                </div>
                <div class="presets" style="margin-top: 8px;">
                    <button class="preset-chip" data-val="10">10g</button>
                    <button class="preset-chip" data-val="15">15g</button>
                    <button class="preset-chip" data-val="20">20g</button>
                    <button class="preset-chip" data-val="30">30g</button>
                </div>
            </div>

            <!-- 入力フィールド: マグ容量 (初期非表示) -->
            <div class="input-group" id="group-mug" style="display: none;">
                <label>マグカップ・サーバーの容量</label>
                <div class="input-with-unit">
                    <input type="number" id="input-mug" value="150" min="50" max="1000" step="10">
                    <span class="unit">ml</span>
                </div>
                <div class="presets" style="margin-top: 8px;">
                    <button class="preset-chip" data-val="150">150ml (小)</button>
                    <button class="preset-chip" data-val="200">200ml (中)</button>
                    <button class="preset-chip" data-val="300">300ml (大)</button>
                    <button class="preset-chip" data-val="400">400ml (マグ)</button>
                </div>
            </div>

            <!-- 抽出比率 (共通) -->
            <div class="input-group" style="margin-top: 20px;">
                <label>
                    <span>抽出比率 (1gの豆に対して何gのお湯)</span>
                    <span id="ratio-display" style="color: var(--primary); font-weight: 700;">1 : 15</span>
                </label>
                <div class="range-slider">
                    <input type="range" id="input-ratio" min="12" max="18" step="0.5" value="15">
                </div>
                <div class="presets" style="margin-top: 8px;">
                    <button class="preset-chip" data-val="13">1:13 (濃いめ)</button>
                    <button class="preset-chip active" data-val="15">1:15 (標準)</button>
                    <button class="preset-chip" data-val="17">1:17 (すっきり)</button>
                </div>
            </div>
        </div>

        <!-- 結果表示カード -->
        <div class="card">
            <div class="result-grid">
                <div class="result-box highlight">
                    <div class="result-label">必要な総湯量 (お湯)</div>
                    <div class="result-value"><span id="res-water">225</span><span class="result-unit"> ml (g)</span></div>
                </div>
                <div class="result-box">
                    <div class="result-label">コーヒー豆の粉量</div>
                    <div class="result-value"><span id="res-beans">15</span><span class="result-unit"> g</span></div>
                </div>
                <div class="result-box">
                    <div class="result-label">出来上がり量(目安)</div>
                    <div class="result-value"><span id="res-output">190</span><span class="result-unit"> ml</span></div>
                </div>
            </div>

            <!-- 抽出ステップ -->
            <div class="steps-container">
                <div class="steps-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    おすすめドリップ手順（4投法）
                </div>
                <ul class="step-list" id="step-list">
                    <!-- JSで動的生成 -->
                </ul>
            </div>
        </div>

        <footer>
            &copy; 2558 ハンドドリップ珈琲シミュレーター
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 要素の取得
            const modeBtns = document.querySelectorAll('.mode-btn');
            const groups = {
                cups: document.getElementById('group-cups'),
                beans: document.getElementById('group-beans'),
                mug: document.getElementById('group-mug')
            };

            const inputCups = document.getElementById('input-cups');
            const inputBeans = document.getElementById('input-beans');
            const inputMug = document.getElementById('input-mug');
            const inputRatio = document.getElementById('input-ratio');
            const ratioDisplay = document.getElementById('ratio-display');

            const resWater = document.getElementById('res-water');
            const resBeans = document.getElementById('res-beans');
            const resOutput = document.getElementById('res-output');
            const stepList = document.getElementById('step-list');

            // 定数
            const CUP_STANDARD_ML = 150; // 1杯あたりの標準湯量

            // 状態管理
            let state = {
                mode: 'cups', // 'cups' | 'beans' | 'mug'
                cups: 1,
                beans: 15,
                mug: 150,
                ratio: 15
            };

            // LocalStorageからロード
            function loadState() {
                const saved = localStorage.getItem('coffee_simulator_state');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        state = { ...state, ...parsed };
                    } catch (e) {
                        console.error('Failed to load state', e);
                    }
                }
                // DOMへの反映
                inputCups.value = state.cups;
                inputBeans.value = state.beans;
                inputMug.value = state.mug;
                inputRatio.value = state.ratio;
                ratioDisplay.textContent = `1 : ${state.ratio}`;

                // モードボタンの見た目更新
                modeBtns.forEach(btn => {
                    if (btn.dataset.mode === state.mode) {
                        btn.classList.add('active');
                        groups[btn.dataset.mode].style.display = 'block';
                    } else {
                        btn.classList.remove('active');
                        groups[btn.dataset.mode].style.display = 'none';
                    }
                });
            }

            // LocalStorageへセーブ
            function saveState() {
                localStorage.setItem('coffee_simulator_state', JSON.stringify(state));
            }

            // 計算と描画のメイン処理
            function calculate() {
                let beans = 0;
                let water = 0;

                const ratio = parseFloat(state.ratio);

                if (state.mode === 'cups') {
                    water = parseFloat(state.cups) * CUP_STANDARD_ML;
                    beans = Math.round((water / ratio) * 10) / 10;
                    // 水量再計算（比率厳密化）
                    water = Math.round(beans * ratio);
                } else if (state.mode === 'beans') {
                    beans = parseFloat(state.beans) || 0;
                    water = Math.round(beans * ratio);
                } else if (state.mode === 'mug') {
                    water = parseFloat(state.mug) || 0;
                    beans = Math.round((water / ratio) * 10) / 10;
                }

                // 豆が粉を吸う量（約2g吸水 / 1gの豆）を引いた出来上がり量
                const absorbed = beans * 2;
                const output = Math.max(0, Math.round(water - absorbed));

                // 画面反映
                resWater.textContent = water;
                resBeans.textContent = beans;
                resOutput.textContent = output;

                // ステップ生成 (蒸らし + 3投)
                renderSteps(water);
            }

            // 抽出ステップの動的生成
            function renderSteps(totalWater) {
                stepList.innerHTML = '';

                // 蒸らし分は総湯量の約20% or 最低30ml
                const bloomWater = Math.min(Math.max(Math.round(totalWater * 0.15), 30), 50);
                const remainingWater = totalWater - bloomWater;
                const pourCount = 3;
                const eachPour = Math.round(remainingWater / pourCount);

                let cumulative = 0;

                const steps = [
                    { time: '0:00', desc: '蒸らし（全体に行き渡らせる）', amount: bloomWater },
                    { time: '0:45', desc: '1投目（中心から「の」の字）', amount: (cumulative += bloomWater, cumulative += eachPour) },
                    { time: '1:15', desc: '2投目（液面が下がったら）', amount: (cumulative += eachPour) },
                    { time: '1:45', desc: '3投目（目標湯量まで注ぐ）', amount: totalWater }
                ];

                steps.forEach(step => {
                    const li = document.createElement('li');
                    li.className = 'step-item';
                    li.innerHTML = `
                        <div>
                            <span class="step-time">${step.time}</span>
                            <span class="step-desc" style="margin-left: 8px;">${step.desc}</span>
                        </div>
                        <span class="step-amount">${step.amount} ml</span>
                    `;
                    stepList.appendChild(li);
                });
            }

            // イベントリスナー: モード切替
            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    modeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const mode = btn.dataset.mode;
                    state.mode = mode;

                    Object.keys(groups).forEach(key => {
                        groups[key].style.display = (key === mode) ? 'block' : 'none';
                    });

                    saveState();
                    calculate();
                });
            });

            // イベントリスナー: 入力値変更
            inputCups.addEventListener('input', (e) => {
                state.cups = e.target.value;
                saveState();
                calculate();
            });

            inputBeans.addEventListener('input', (e) => {
                state.beans = e.target.value;
                saveState();
                calculate();
            });

            inputMug.addEventListener('input', (e) => {
                state.mug = e.target.value;
                saveState();
                calculate();
            });

            inputRatio.addEventListener('input', (e) => {
                state.ratio = e.target.value;
                ratioDisplay.textContent = `1 : ${state.ratio}`;
                
                // 比率のプリチップのアクティブ状態更新
                document.querySelectorAll('#input-ratio').forEach(el => {}); // 簡略
                const chips = inputRatio.closest('.input-group').querySelectorAll('.preset-chip');
                chips.forEach(chip => {
                    if (parseFloat(chip.dataset.val) === parseFloat(state.ratio)) {
                        chip.classList.add('active');
                    } else {
                        chip.classList.remove('active');
                    }
                });

                saveState();
                calculate();
            });

            // プリセットチップのクリック処理
            document.querySelectorAll('.presets').forEach(container => {
                container.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('preset-chip')) return;
                    const val = e.target.dataset.val;

                    // 親のinput-groupを特定して値を割り振る
                    const group = e.target.closest('.input-group');
                    const chipGroup = e.target.closest('.presets');
                    
                    // 比率用チップか判定
                    if (chipGroup.previousElementSibling && chipGroup.previousElementSibling.querySelector('#input-ratio') || e.target.closest('.input-group').querySelector('#input-ratio')) {
                        // 比率チップの場合
                        inputRatio.value = val;
                        state.ratio = val;
                        ratioDisplay.textContent = `1 : ${val}`;
                    } else {
                        // 各種入力チップの場合
                        const targetInput = group.querySelector('input[type="number"]');
                        if (targetInput) {
                            targetInput.value = val;
                            if (state.mode === 'cups') state.cups = val;
                            if (state.mode === 'beans') state.beans = val;
                            if (state.mode === 'mug') state.mug = val;
                        }
                    }

                    // チップのactive切り替え
                    group.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
                    e.target.classList.add('active');

                    saveState();
                    calculate();
                });
            });

            // 初期化実行
            loadState();
            calculate();
        });
    </script>
</body>
</html>
